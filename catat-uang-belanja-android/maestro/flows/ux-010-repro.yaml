appId: com.catatuangbelanja.catat_uang_belanja
---
# Repro for UX-010: static content on Beranda ("Anggaran" header, the
# budget-status banner, "Transaksi Terbaru" header, and every preview row)
# and every date-group header on Semua Transaksi ("HARI INI", "KEMARIN",
# "2 HARI LALU", ...) get merged by Flutter into a SINGLE accessibility
# node each, instead of one node per logical unit. Confirmed via
# `adb shell uiautomator dump`, not just visual inspection — inspect the
# pulled window_dump.xml for a content-desc containing every group's label
# concatenated with literal "&#10;" (newline) separators.
- launchApp:
    clearState: true
- waitForAnimationToEnd:
    timeout: 4000
- tapOn: "Pengaturan"
- waitForAnimationToEnd:
    timeout: 2000
- tapOn: "Generate Data Dummy"
- waitForAnimationToEnd:
    timeout: 1500
- tapOn: "Ya, Isi"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn: "Beranda"
- waitForAnimationToEnd:
    timeout: 2000
# At this point, `adb shell uiautomator dump` shows one node spanning the
# whole "Anggaran" + "Transaksi Terbaru" section with all headers/rows
# concatenated into one content-desc.
- tapOn: "Lihat semua →"
- waitForAnimationToEnd:
    timeout: 1500
# Here, `adb shell uiautomator dump` shows one node whose content-desc is
# every date-group label ("HARI INI\nKEMARIN\n2 HARI LALU\n...") joined
# together — dozens of headers read as a single TalkBack announcement.
