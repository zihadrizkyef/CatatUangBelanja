appId: com.catatuangbelanja.catat_uang_belanja
---
# Repro for UX-009: in dark mode, a transfer row's icon circle on Beranda's
# "Transaksi Terbaru" renders as a blank/invisible circle. Root cause:
# HomeTransactionRow uses AppColors.lightChipNeutral (0xFFF3ECE6, a fixed
# light color, not palette-aware) as the icon background whenever
# `category` is null (true for transfers), while the fallback
# Icons.swap_horiz_rounded is colored with palette.textPrimary — which in
# dark mode is AppColors.darkTextPrimary (0xFFF3E9E4). Those two colors are
# nearly identical, so the icon disappears into its own background.
- launchApp:
    clearState: true
- waitForAnimationToEnd:
    timeout: 4000
- tapOn: "Pengaturan"
- waitForAnimationToEnd:
    timeout: 2000
- tapOn: "Mode Gelap"
- waitForAnimationToEnd:
    timeout: 1000
- tapOn: "Dompet"
- waitForAnimationToEnd:
    timeout: 1500
- tapOn: "Transfer"
- waitForAnimationToEnd:
    timeout: 1000
# Amount digit "1" then confirm — from/to wallets default to the first two.
- tapOn:
    point: "19%,58%"
- tapOn:
    point: "81%,83%"
- waitForAnimationToEnd:
    timeout: 1000
- tapOn: "Beranda"
- waitForAnimationToEnd:
    timeout: 1000
- takeScreenshot: ux-009-transfer-icon-invisible-dark-mode
