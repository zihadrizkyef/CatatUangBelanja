appId: com.catatuangbelanja.catat_uang_belanja
---
# Repro for UX-003: on a fresh install (no transactions at all yet),
# Rangkuman's "<periode> ini vs sebelumnya" card shows "▲ 0% lebih boros"
# instead of a neutral state, because summary_screen.dart's changePct
# defaults to the "not improved" branch (`improved = changePct < 0` is
# false when changePct == 0) even when there is literally nothing to
# compare (both current and previous period expense are 0).
- launchApp:
    clearState: true
- waitForAnimationToEnd:
    timeout: 4000
- tapOn: "Rangkuman"
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: ux-003-zero-data-boros-label
