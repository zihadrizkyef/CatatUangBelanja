appId: com.catatuangbelanja.catat_uang_belanja
---
# Repro for UX-002: the FAB on Beranda permanently overlaps/obscures the
# amount of the last "Transaksi Terbaru" card once there are >=5
# transactions (the preview list isn't tall enough to need scrolling, so
# the card sitting under the FAB's footprint never scrolls clear of it).
- launchApp:
    clearState: true
- waitForAnimationToEnd:
    timeout: 4000
- tapOn: "Pengaturan"
- waitForAnimationToEnd:
    timeout: 2000
- tapOn: "Generate Data Dummy"
- waitForAnimationToEnd:
    timeout: 1500
- tapOn: "Ya, Isi"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn: "Beranda"
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: ux-002-fab-overlap
