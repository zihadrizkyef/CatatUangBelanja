appId: com.catatuangbelanja.catat_uang_belanja
---
# Repro for UX-008: Beranda's "Transaksi Terbaru" rows look identical to
# Semua Transaksi's rows (same card style, same info) but are NOT tappable
# to edit — tapping one does nothing at all, no ripple, no navigation.
# Only the Semua Transaksi list (reached via "Lihat semua") lets you edit.
- launchApp:
    clearState: true
- waitForAnimationToEnd:
    timeout: 4000
- tapOn: "Pengaturan"
- waitForAnimationToEnd:
    timeout: 2000
- tapOn: "Generate Data Dummy"
- waitForAnimationToEnd:
    timeout: 1500
- tapOn: "Ya, Isi"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn: "Beranda"
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: ux-008-before-tap-row
# Tap the first "Transaksi Terbaru" row on Beranda — nothing happens.
- tapOn:
    point: "50%,79%"
- waitForAnimationToEnd:
    timeout: 800
- takeScreenshot: ux-008-after-tap-row-nothing-happens
