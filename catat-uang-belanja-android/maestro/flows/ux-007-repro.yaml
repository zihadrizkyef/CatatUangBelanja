appId: com.catatuangbelanja.catat_uang_belanja
---
# Repro for UX-007: the "✓" confirm/save button on Tambah Pengeluaran/
# Pemasukan, Transfer Saldo, and Tambah Dompet silently does nothing when
# validation fails (no category selected, amount still Rp 0, or empty
# wallet name) — no snackbar/error text/shake, the sheet just sits there.
- launchApp:
    clearState: true
- waitForAnimationToEnd:
    timeout: 4000
- tapOn: "Beranda"
- waitForAnimationToEnd:
    timeout: 1000
# Open the "+" FAB to start a new expense.
- tapOn:
    point: "89%,79%"
- waitForAnimationToEnd:
    timeout: 1000
- takeScreenshot: ux-007-empty-sheet
# Tap the "✓" key with amount still Rp 0 and no category selected.
- tapOn:
    point: "81%,83%"
- waitForAnimationToEnd:
    timeout: 800
- takeScreenshot: ux-007-after-tap-check-nothing-happens
